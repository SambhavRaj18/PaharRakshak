<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2137"/>
      <stop offset="50%" stop-color="#183658"/>
      <stop offset="100%" stop-color="#0a131f"/>
    </linearGradient>
    <linearGradient id="peakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="mountainGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="mountainGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background Shield Card -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer Ring Glow -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="14 10" opacity="0.4"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#10b981" stroke-width="3" opacity="0.3"/>

  <!-- Himalayan Peaks -->
  <polygon points="120,360 256,150 392,360" fill="url(#mountainGrad2)" opacity="0.85"/>
  <polygon points="256,150 200,230 256,220 310,230" fill="url(#peakGrad)"/>
  
  <polygon points="60,380 180,210 320,380" fill="url(#mountainGrad1)" opacity="0.9"/>
  <polygon points="180,210 140,270 180,260 220,270" fill="#ffffff" opacity="0.9"/>

  <polygon points="220,390 350,230 460,390" fill="#0369a1" opacity="0.95"/>
  <polygon points="350,230 310,280 350,275 390,280" fill="#ffffff" opacity="0.95"/>

  <!-- Pulse Alert Ring -->
  <circle cx="256" cy="256" r="80" fill="none" stroke="#ef4444" stroke-width="5" opacity="0.7"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 6" opacity="0.5"/>

  <!-- Train / Road Track Curve -->
  <path d="M 80,410 C 180,390 330,430 432,410" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>
  <path d="M 80,425 C 180,405 330,445 432,425" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="10 12"/>

  <!-- Radio / Mesh Waves -->
  <path d="M 216,110 A 50,50 0 0 1 296,110" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <path d="M 196,85 A 80,80 0 0 1 316,85" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <path d="M 176,60 A 110,110 0 0 1 336,60" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.4"/>

  <!-- Center Warning / Shield Node -->
  <circle cx="256" cy="140" r="14" fill="#ef4444"/>
</svg>
